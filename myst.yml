# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: ee2374e8-daef-44d2-b1b7-976e709a3ef6
  title: IFRI Mini ML Library
  description: A mini machine learning library implemented in Python, designed for educational purposes and to provide a hands-on experience with fundamental ML algorithms.
  keywords: ["machine learning", "python", "neural networks", "ml algorithms", "mini library"]
  authors: ["IFRI AI Classes"]
  github: https://github.com/IFRI-AI-Classes/ifri_mini_ml_lib
  # To autogenerate a Table of Contents, run "jupyter book init --write-toc"
  toc:
    - file: README.md
    - title: Supervised learning
      children:
        - title: Classification
          children:
            - file: notebooks/classification/knn.ipynb
            - file: notebooks/classification/decision_tree.ipynb
            - file: notebooks/classification/logistic_regression.ipynb
            - file: notebooks/classification/naive_bayes.ipynb
            - file: notebooks/classification/random_forest.ipynb
            - file: notebooks/svm.ipynb
        - title: Regression
          children:
            - file: notebooks/regression/linear_regression.ipynb
            - file: notebooks/regression/polynomial_regression.ipynb
            
    - title: Data preprocessing
      children:
        - title: Preparation
          children:
            - file: notebooks/preprocessing/preparation/missing_value.ipynb
            - file: notebooks/preprocessing/preparation/scaler/minmax_scaler.ipynb
            - file: notebooks/preprocessing/preparation/scaler/standard_scaler.ipynb
            - file: notebooks/preprocessing/preparation/encoding.ipynb
            - file: notebooks/preprocessing/preparation/OrdinalEncoder.ipynb
            - file: notebooks/preprocessing/preparation/data_splitter.ipynb
        - title: Dimensionality reduction
          children:
            - file: notebooks/preprocessing/dimensionality_reduction/pca.ipynb
            - file: notebooks/preprocessing/dimensionality_reduction/tsne.ipynb
        - title: Outliers
          children:
            - file: notebooks/outliers/outliers.ipynb
            
    - title: Unsupervised Learning
      children:
        - title: Anomalies detection
          children:
            - file: notebooks/anomalies_detections/iqr.ipynb
            - file: notebooks/anomalies_detections/z_score.ipynb
            - file: notebooks/anomalies_detections/isolation.ipynb

    - title: Neural networks
      children:
        - file: notebooks/neural_networks/perceptron.ipynb
        - file: notebooks/neural_networks/mlp.ipynb

    - title: Bias and fairness
      children:
        - file: notebooks/evaluation/bias_evaluation.ipynb    
    
    - title: Natural language processing
      children:
        - file: notebooks/nlp/nlp.ipynb

  execute:
    execute_notebooks: auto

site:
  template: book-theme
  options:
  #   favicon: favicon.ico
    logo: notebooks/assets/imgs/logo_iai_classes.png
    logo_text: IMML
    primary_color: "#1a6fa3"
    style: "notebooks/assets/custom.css"
    # Set the repository URL for the "Edit this page" links